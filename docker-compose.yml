version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: photo-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: photoprint
    ports:
      - "3306:3306" # 将宿主机的 3307 映射到容器的 3306
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  backend:
    build: .
    container_name: photo-backend
    restart: always
    ports:
      - "8081:8080"
    env_file:
      # 环境变量 config读取
      - .env.prod
    volumes:
      - ./uploads:/root/uploads # 持久化照片文件
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
